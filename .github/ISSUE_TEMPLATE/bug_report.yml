name: Bug report
description: Something behaves differently from what the docs or the spec say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security vulnerabilities do **not** go here —
        use a [private advisory](https://github.com/jeansossmeier/modupy/security/advisories/new)
        instead (see SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest app or test that shows the problem. A failing `pytest`
        snippet using the bundled `modulith_app` fixture is ideal.
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or log output
      description: Paste the full traceback if there is one.
      render: shell

  - type: input
    id: version
    attributes:
      label: modupy version
      description: "Output of `modulith --version` (or `pip show modupy`)."
      placeholder: "0.11.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: dropdown
    id: topology
    attributes:
      label: Topology
      options:
        - single process (default)
        - processes (process-per-module)
        - not applicable
    validations:
      required: true

  - type: dropdown
    id: broker
    attributes:
      label: Broker
      options:
        - in-memory (default, single process)
        - shm
        - database (Postgres / MySQL / SQLite)
        - redis
        - not applicable
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: "Your `[tool.modulith]` table and any `MODULITH_*` environment variables."
      render: toml
