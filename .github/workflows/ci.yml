name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of this workflow for the same ref so a quick push
# rebases doesn't burn CI minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: uv pip install --system -e ".[all]"

      - name: Run pytest
        # Deselect the integration suite explicitly: in this job the
        # testcontainers drivers are absent, so `-m integration` tests would
        # silently skip — a permanently-green lane proving nothing. The real
        # integration lane below runs them against Docker.
        run: pytest -m "not integration" -v --tb=short

  integration:
    name: pytest -m integration (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project with integration extras
        # `.[integration]` layers testcontainers + the REAL Postgres drivers
        # (asyncpg for the outbox, sync psycopg for Alembic) on top of the
        # default test extra. GitHub-hosted ubuntu runners ship a working
        # Docker daemon, which testcontainers uses to start disposable
        # postgres:16 / redis:7 containers.
        run: uv pip install --system -e ".[integration]"

      - name: Docker preflight
        # tests/conftest.py pytest.skip's the ENTIRE integration suite when
        # Docker is unreachable, and pytest exits 0 on all-skipped — without
        # this preflight a runner-image Docker breakage turns the lane
        # permanently green while proving nothing (W3 R5-01): the exact
        # rubber-stamp the unit-lane comment above warns about.
        run: docker info

      - name: Run integration suite
        # Belt and braces with the preflight: ANY skip in this lane means the
        # Docker/testcontainers path silently degraded mid-run. Fail the job
        # when the pytest summary reports skipped tests or no passed tests
        # (W3 R5-01).
        run: |
          set -o pipefail
          pytest -m integration -v | tee pytest-integration.log
          summary=$(tail -n 1 pytest-integration.log)
          echo "summary line: $summary"
          if ! echo "$summary" | grep -qE '[0-9]+ passed'; then
            echo "::error::integration lane reported no passed tests — the suite did not run"
            exit 1
          fi
          if echo "$summary" | grep -qE '[0-9]+ skipped'; then
            echo "::error::integration lane skipped tests — Docker/testcontainers degraded"
            exit 1
          fi

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install ruff
        # Constraint mirrors pyproject.toml's dev extra verbatim — guarded by
        # tests/test_ci_config.py so the two specs can never drift apart.
        run: uv pip install --system "ruff>=0.4,<1.0"

      - name: Lint
        run: ruff check modulith tests

      - name: Format check
        # Once the codebase is consistently formatted, fail on any drift.
        # `ruff format --check` exits non-zero if any file would be reformatted.
        run: ruff format --check modulith tests

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project + mypy
        # `.[dev]` is the single source of truth for the mypy version
        # constraint (no duplicated ad-hoc pin here that could drift from
        # pyproject.toml) and pulls the integration extras so mypy can
        # resolve the imports in tests/ (testcontainers, asyncpg, psycopg).
        run: uv pip install --system -e ".[dev]"

      - name: Type check
        # tests/ is type-checked too; per-module strictness relaxations for
        # tests live in pyproject.toml [[tool.mypy.overrides]].
        run: mypy --strict modulith/ tests/

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build distributions
        run: python -m build

      - name: Smoke-test wheel installs
        # The wheel must install cleanly into a fresh interpreter so users
        # who pip-install from PyPI don't hit packaging surprises in prod.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import modulith; print(modulith.__name__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
