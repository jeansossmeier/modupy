name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repository, so the workflow token
# only needs to read it. Without this the token inherits whatever the repository
# default is, which for many repos is write-all.
permissions:
  contents: read

# Cancel in-flight runs of this workflow for the same ref so a quick push
# rebases doesn't burn CI minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        # `.[dev]` pulls pytest-cov once so the 3.11 coverage cell can enforce
        # fail_under without a second ad-hoc pin that could drift from pyproject.
        run: uv pip install --system -e ".[dev]"

      - name: Run pytest
        if: matrix.python-version != '3.11'
        # Deselect the integration suite explicitly: in this job the
        # testcontainers drivers may be absent, so `-m integration` tests would
        # silently skip — a permanently-green lane proving nothing. The real
        # integration lane below runs them against Docker.
        run: pytest -m "not integration" -v --tb=short

      - name: Run pytest with coverage (3.11 only)
        if: matrix.python-version == '3.11'
        # Coverage is collected once, on 3.11: 90% package-wide,
        # 100% on the outbox plugin. Thresholds live in pyproject.toml
        # [tool.coverage.report] so local and CI agree. Use coverage.py directly
        # instead of pytest --cov=modulith so isolated pytest subprocesses do
        # not inherit pytest-cov's process environment.
        run: |
          coverage erase
          coverage run --source=modulith --branch -m pytest \
            -m 'not integration' -v --tb=short
          coverage report --fail-under=90
          coverage report --include='modulith/builtin/outbox.py' --fail-under=100

  shm:
    name: focused SHM (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: uv pip install --system -e ".[test]"

      - name: Run focused SHM and state tests serially
        run: >-
          pytest -q
          tests/test_shm_broker.py
          tests/test_shm_coldstore.py
          tests/test_shm_consumer.py
          tests/test_shm_ring.py
          tests/test_shm_scenarios.py
          tests/test_shm_store.py
          tests/test_state_path.py

  integration:
    name: pytest -m integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both ends of the supported range.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project with integration extras
        # `.[integration]` layers testcontainers + the REAL Postgres drivers
        # (asyncpg for the outbox, sync psycopg for Alembic) on top of the
        # default test extra. GitHub-hosted ubuntu runners ship a working
        # Docker daemon, which testcontainers uses to start disposable
        # postgres:16 / redis:7 containers.
        run: uv pip install --system -e ".[integration]"

      - name: Docker preflight
        # tests/conftest.py pytest.skip's the ENTIRE integration suite when
        # Docker is unreachable, and pytest exits 0 on all-skipped — without
        # this preflight a runner-image Docker breakage turns the lane
        # permanently green while proving nothing: the exact
        # rubber-stamp the unit-lane comment above warns about.
        run: docker info

      - name: Run integration suite
        # Belt and braces with the preflight: ANY skip in this lane means the
        # Docker/testcontainers path silently degraded mid-run. Fail the job
        # when the pytest summary reports skipped tests or no passed tests.
        run: |
          set -o pipefail
          pytest -m integration -v | tee pytest-integration.log
          summary=$(tail -n 1 pytest-integration.log)
          echo "summary line: $summary"
          if ! echo "$summary" | grep -qE '[0-9]+ passed'; then
            echo "::error::integration lane reported no passed tests — the suite did not run"
            exit 1
          fi
          if echo "$summary" | grep -qE '[0-9]+ skipped'; then
            echo "::error::integration lane skipped tests — Docker/testcontainers degraded"
            exit 1
          fi

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install ruff
        # Constraint mirrors pyproject.toml's dev extra verbatim — guarded by
        # tests/test_ci_config.py so the two specs can never drift apart.
        run: uv pip install --system "ruff>=0.4,<1.0"

      - name: Lint
        # Covers packaged tooling and examples, not just the library.
        run: ruff check modulith tests scripts examples

      - name: Format check
        # Once the codebase is consistently formatted, fail on any drift.
        # `ruff format --check` exits non-zero if any file would be reformatted.
        run: ruff format --check modulith tests scripts examples

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project + mypy
        # `.[dev]` is the single source of truth for the mypy version
        # constraint (no duplicated ad-hoc pin here that could drift from
        # pyproject.toml) and pulls the integration extras so mypy can
        # resolve the imports in tests/ (testcontainers, asyncpg, psycopg).
        run: uv pip install --system -e ".[dev]"

      - name: Type check
        # tests/ is type-checked too; per-module strictness relaxations for
        # tests live in pyproject.toml [[tool.mypy.overrides]]. scripts/ and
        # examples/ are checked too — they ship in the sdist.
        run: mypy --strict modulith/ tests/ scripts/ examples/

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build distributions
        run: python -m build

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import re
          import tarfile
          import zipfile

          adapters = Path("modulith/adapters")
          required = {path.as_posix() for path in adapters.glob("_shm*.py")}
          required.update(
              {
                  "modulith/adapters/shm_broker.py",
                  "modulith/adapters/_state_path.py",
                  "modulith/adapters/_consumer_protocol.py",
                  "modulith/adapters/_delivery_dispatch.py",
                  "modulith/adapters/_polling_consumer.py",
              }
          )

          # An sdist puts everything under one `<distribution>-<version>/` root
          # and a wheel puts metadata under `<distribution>-<version>.dist-info/`.
          # Match the shape rather than the literal distribution name: the
          # distribution is `modupy` while the import package is `modulith`, and
          # a name-specific prefix would silently strip nothing after a rename,
          # turning every assertion below into a no-op.
          ARCHIVE_ROOT = re.compile(r"^[A-Za-z0-9._]+-\d[A-Za-z0-9._+!-]*(\.dist-info)?$")

          def normalized(names):
              result = set()
              for name in names:
                  parts = PurePosixPath(name).parts
                  if parts and ARCHIVE_ROOT.match(parts[0]):
                      parts = parts[1:]
                  if parts:
                      result.add("/".join(parts))
              return result

          def forbidden(name):
              parts = PurePosixPath(name).parts
              filename = parts[-1] if parts else ""
              analysis = any(part in {".code_analyzer", "graphify-out"} for part in parts)
              state = filename.endswith(
                  (".db", ".db-wal", ".db-shm", ".db-journal", ".hints", ".mmap")
              )
              temporary_hint = filename.endswith(".tmp") and (
                  "hint" in filename or "mmap" in filename or "notifier" in filename
              )
              return analysis or state or temporary_hint

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = normalized(archive.namelist())
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = normalized(archive.getnames())

          for label, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              missing = sorted(required - names)
              leaked = sorted(name for name in names if forbidden(name))
              assert not missing, f"{label} missing runtime modules: {missing}"
              assert not leaked, f"{label} contains private artifacts: {leaked}"
              print(f"{label}: runtime modules present; private artifacts absent")
          PY

      - name: Smoke-test wheel installs
        # The wheel must install cleanly into a fresh interpreter so users
        # who pip-install from PyPI don't hit packaging surprises in prod.
        # Installs with all extras, verifies entry points and packaged assets,
        # and runs a packaged SQLite migration end to end.
        run: |
          python -m venv /tmp/smoke
          WHL=$(ls dist/*.whl)
          /tmp/smoke/bin/pip install "${WHL}[all]"
          /tmp/smoke/bin/python -c "import modulith; print(modulith.__name__)"
          /tmp/smoke/bin/modulith --help
          /tmp/smoke/bin/python -c "from importlib.metadata import entry_points; eps = entry_points(group='console_scripts'); assert any(e.name == 'modulith' for e in eps)"
          /tmp/smoke/bin/python - <<'PY'
          from pathlib import Path
          import tempfile
          from alembic import command
          from alembic.config import Config
          import modulith.adapters as adapters_pkg
          migrations = Path(adapters_pkg.__file__).parent / "migrations"
          with tempfile.TemporaryDirectory() as td:
              db = Path(td) / "smoke.db"
              cfg = Config()
              cfg.set_main_option("script_location", str(migrations))
              cfg.set_main_option("sqlalchemy.url", f"sqlite:///{db}")
              command.upgrade(cfg, "head")
              print("sqlite migration ok", db.exists())
          PY

      - name: API-reference drift check
        run: |
          python -m venv /tmp/api-ref
          /tmp/api-ref/bin/pip install -e ".[dev]"
          /tmp/api-ref/bin/python scripts/gen_api_reference.py --check

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
