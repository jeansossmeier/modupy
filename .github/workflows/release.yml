name: Release

on:
  push:
    tags: ['v*']

# Least privilege by default. The publish job re-declares its own broader
# permissions block (id-token: write for PyPI trusted publishing); a job-level
# block replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  ci:
    name: full CI matrix
    uses: ./.github/workflows/ci.yml

  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Run pytest
        # Gate against broken test trees before publishing.
        # Explicitly deselect integration tests since Docker may not be available
        # in the release environment.
        run: pytest -m "not integration" -v --tb=short

      - name: Lint
        # Same gate CI applies on every PR. A tag push can reach this workflow
        # without ever having gone through CI (a tag on an unmerged commit, a
        # re-tag, a force-push), so the release path re-runs the checks itself.
        run: |
          ruff check modulith tests scripts examples
          ruff format --check modulith tests scripts examples

      - name: Type check
        run: mypy --strict modulith/ tests/ scripts/ examples/

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml version
        # Fails fast before the build so a tag/pyproject drift never reaches
        # publish. Handles both v-prefixed (v1.2.3) and bare (1.2.3) tags.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject_version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$tag" != "$pyproject_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (normalized: $tag) does not match pyproject.toml version $pyproject_version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches pyproject.toml version $pyproject_version"

      - name: Verify CHANGELOG has an entry for this version
        # An unreleased-notes gap is invisible until users go looking for it
        # after the fact, when the release is already immutable on PyPI.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Headings use the Keep a Changelog form `## [version] — date`; accept a
          # bare or v-prefixed variant too so a style change here is not a
          # release-blocking surprise.
          if ! grep -qE "^#+ +\[?v?${tag//./\\.}\]?([^0-9.]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no heading for version $tag"
            exit 1
          fi
          echo "CHANGELOG.md documents $tag"

      - name: Install build
        run: pip install build

      - name: Build distributions
        run: python -m build

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import re
          import tarfile
          import zipfile

          adapters = Path("modulith/adapters")
          required = {path.as_posix() for path in adapters.glob("_shm*.py")}
          required.update(
              {path.as_posix() for path in adapters.glob("migrations/versions/*.py")}
          )
          required.update(
              {
                  "modulith/adapters/shm_broker.py",
                  "modulith/adapters/_state_path.py",
                  "modulith/adapters/_consumer_protocol.py",
                  "modulith/adapters/_delivery_dispatch.py",
                  "modulith/adapters/_polling_consumer.py",
                  "modulith/adapters/alembic.ini",
                  "modulith/adapters/migrations/env.py",
                  "modulith/adapters/migrations/script.py.mako",
                  "modulith/py.typed",
              }
          )

          # An sdist puts everything under one `<distribution>-<version>/` root
          # and a wheel puts metadata under `<distribution>-<version>.dist-info/`.
          # Match the shape rather than the literal distribution name: the
          # distribution is `modupy` while the import package is `modulith`, and
          # a name-specific prefix would silently strip nothing after a rename,
          # turning every assertion below into a no-op.
          ARCHIVE_ROOT = re.compile(r"^[A-Za-z0-9._]+-\d[A-Za-z0-9._+!-]*(\.dist-info)?$")

          def normalized(names):
              result = set()
              for name in names:
                  parts = PurePosixPath(name).parts
                  if parts and ARCHIVE_ROOT.match(parts[0]):
                      parts = parts[1:]
                  if parts:
                      result.add("/".join(parts))
              return result

          def forbidden(name):
              parts = PurePosixPath(name).parts
              filename = parts[-1] if parts else ""
              analysis = any(part in {".code_analyzer", "graphify-out"} for part in parts)
              state = filename.endswith(
                  (".db", ".db-wal", ".db-shm", ".db-journal", ".hints", ".mmap")
              )
              temporary_hint = filename.endswith(".tmp") and (
                  "hint" in filename or "mmap" in filename or "notifier" in filename
              )
              return analysis or state or temporary_hint

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = normalized(archive.namelist())
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = normalized(archive.getnames())

          for label, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              missing = sorted(required - names)
              leaked = sorted(name for name in names if forbidden(name))
              assert not missing, f"{label} missing runtime modules: {missing}"
              assert not leaked, f"{label} contains private artifacts: {leaked}"
              print(f"{label}: runtime modules present; private artifacts absent")
          PY

      - name: Smoke-test wheel installs
        run: |
          python -m venv /tmp/smoke
          WHL=$(ls dist/*.whl)
          /tmp/smoke/bin/pip install "${WHL}[all]"
          /tmp/smoke/bin/python -c "import modulith; print(modulith.__name__)"
          /tmp/smoke/bin/modulith --help
          /tmp/smoke/bin/python -c "from importlib.metadata import entry_points; eps = entry_points(group='console_scripts'); assert any(e.name == 'modulith' for e in eps)"
          /tmp/smoke/bin/python - <<'PY'
          from pathlib import Path
          import tempfile
          from alembic import command
          from alembic.config import Config
          import modulith.adapters as adapters_pkg
          alembic_ini = Path(adapters_pkg.__file__).parent / "alembic.ini"
          with tempfile.TemporaryDirectory() as td:
              db = Path(td) / "smoke.db"
              cfg = Config(str(alembic_ini))
              cfg.set_main_option("sqlalchemy.url", f"sqlite:///{db}")
              command.upgrade(cfg, "head")
              print("sqlite migration ok", db.exists())
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 14

  publish:
    needs: [ci, test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
