# Alembic configuration for the modulith outbox schema.
#
# The database URL is resolved at runtime by env.py (from -x url=..., the
# MODULITH_DB_URL env var, or the sqlalchemy.url below), so this file ships
# with a harmless placeholder. Typical use:
#
#   alembic -c modulith/adapters/alembic.ini -x url=postgresql+asyncpg://... upgrade head
#   MODULITH_DB_URL=postgresql+psycopg://... alembic -c modulith/adapters/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
