# modulith — pyproject.toml
#
# This is the project metadata and build configuration. It defines:
#   - Package metadata (name, version, description, license, authors)
#   - Runtime dependencies (just pluggy, intentionally minimal)
#   - Optional extras (postgres, redis, otel, fastapi, cli, test, integration,
#     all, dev — no kafka extra: the adapter is unshipped, see the NOTE below)
#   - The `modulith` console script entry point
#   - The `modulith` plugin entry point group for third-party plugins
#   - Tool configurations (pytest, ruff, mypy)
#
# Design notes:
# - Core dependencies are intentionally minimal. We don't pull in SQLAlchemy
#   for users who don't use the outbox; we don't pull in FastAPI for users
#   who use Starlette directly. Each adapter goes behind an extra.
# - `pip install modulith` gives you the framework. `pip install modulith[all]`
#   gives you everything. Most users will pick 2-3 extras.

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "modulith"
version = "0.1.0"
description = "Modular monolith pattern for Python — module structure, event-driven boundaries, transactional outbox, optional process-per-module runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "modulith contributors" }]
keywords = [
    "modular-monolith",
    "ddd",
    "event-driven",
    "transactional-outbox",
    "fastapi",
    "spring-modulith",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: FastAPI",
]

# Core runtime dependencies. Kept minimal on purpose — every dep is an
# adoption tax. pluggy is the only non-stdlib must-have.
dependencies = [
    "pluggy>=1.3,<2.0",
]

# Upper bounds on every optional dep: a future major-version bump in any
# of these libraries can break adapter contracts (SQLAlchemy 3.0, redis 7,
# OTel 2.0, etc.) without warning. Pinning the upper bound forces a
# conscious decision to test against the next major before letting users
# resolve to it. We loosen these per release as compatibility is verified.
[project.optional-dependencies]
# Postgres outbox adapter. Pulls in async SQLAlchemy + asyncpg, plus
# Alembic for the outbox schema migrations in adapters/migrations/.
postgres = [
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
]

# Redis Streams broker. The default broker for process-per-module mode.
# redis-py 5/6/7 are API-compatible for the commands the adapter uses
# (XADD/XREADGROUP/XAUTOCLAIM/XACK and aclose()); upper bound tracks the next
# unverified major.
redis = [
    "redis>=5.0,<8.0",
]

# Database broker (relational DB as cross-module transport — Redis-free
# process-per-module). One adapter, three dialects inferred from the URL:
# Postgres/MySQL for a real server broker, SQLite for zero-dependency
# bootstrap. Pulls in async SQLAlchemy plus a driver per dialect the app uses
# (asyncpg / aiomysql / aiosqlite). asyncpg + aiosqlite already ship via the
# postgres/test extras; aiomysql is the only MySQL-specific addition.
database = [
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "aiomysql>=0.2,<1.0",
    # MySQL 8 defaults to caching_sha2_password auth, which aiomysql can only
    # perform when `cryptography` is present — required in practice for MySQL 8.
    "cryptography>=41.0",
    "aiosqlite>=0.19,<1.0",
]

# NOTE: a Kafka broker is on the roadmap (SPEC §10.3) but no adapter ships yet,
# so there is intentionally no `kafka` extra — we don't advertise a dependency
# for a feature that does not exist. It will return when the adapter lands.

# OpenTelemetry auto-instrumentation. Silent no-op if user hasn't
# configured a provider; just spans across module boundaries.
otel = [
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
]

# FastAPI integration helpers. Most users have FastAPI installed already;
# this extra is just for the worker module's create_app() factory.
fastapi = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "httpx>=0.26,<1.0",
]

# The CLI requires typer. Pulled out so users who run modulith without
# the CLI (just `import modulith`) don't pay typer's startup cost.
cli = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
]

# Test plugin (separate package conceptually, included here for v1
# convenience; will split into pytest-modulith in Phase 2).
#
# This extra must install everything the default (non-integration) test suite
# imports at collection time, so `pip install modulith[test] && pytest` is
# reproducible. The suite runs the Postgres adapter against aiosqlite, so we
# pull SQLAlchemy + alembic + aiosqlite directly (NOT asyncpg — the sqlite path
# doesn't need it), plus the feature extras whose libraries the tests import
# (fastapi/httpx for proxy+worker, typer for CLI, otel for observability, redis
# for the broker unit tests).
test = [
    "pytest>=7.4,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.19,<1.0",
    # tests/test_ci_config.py parses .github/workflows/ci.yml structurally
    # (yaml.safe_load) to execute the integration lane's guard logic against
    # synthetic pytest summaries — the CI-drift guards run in the default lane.
    "pyyaml>=6.0,<7.0",
    "modulith[redis,otel,fastapi,cli]",
]

# Integration test suite — the testcontainers-backed end-to-end tests
# (tests/test_*_e2e.py, test_*_integration.py, test_migration_postgres.py,
# test_process_topology_e2e.py). These spin up real Postgres + MySQL + Redis
# via Docker, so they need the REAL drivers, not the sqlite stand-in:
#   - testcontainers: starts disposable postgres:16 / mysql:8 / redis:7 containers
#   - asyncpg: the async Postgres driver the outbox + DB broker run on in prod
#   - aiomysql: the async MySQL driver the DB broker runs on against MySQL 8
#   - psycopg[binary]: the SYNC driver Alembic uses for the migration test
#     (postgresql+psycopg://) — asyncpg can't drive Alembic's sync engine
# Layered on `test` so it also gets pytest, redis, fastapi, etc. Run with
# `pip install modulith[integration] && pytest -m integration`; the suite
# auto-skips these when Docker is unreachable (see tests/conftest.py).
integration = [
    "modulith[test]",
    "testcontainers>=4.0,<5.0",
    "asyncpg>=0.29,<1.0",
    "aiomysql>=0.2,<1.0",
    # aiomysql needs cryptography to auth against MySQL 8 (caching_sha2_password).
    "cryptography>=41.0",
    "psycopg[binary]>=3.1,<4.0",
]

# Everything. For "I want all the features" users.
all = [
    "modulith[postgres,redis,database,otel,fastapi,cli,test]",
]

# Development dependencies — for working ON modulith, not WITH it.
# Includes `integration` so contributors can run the full testcontainers
# suite locally; `all` alone only covers the sqlite-backed default tests.
dev = [
    "modulith[all,integration]",
    "ruff>=0.4,<1.0",
    # mypy 2.0 verified: modulith/ + tests/ type-check clean under --strict
    # with mypy 2.0.0, so the bound is <3.0 (next unverified major). CI's
    # typecheck job installs this extra rather than an ad-hoc pin, so this
    # line is the ONLY place the constraint lives.
    "mypy>=1.10,<3.0",
    "pytest-cov>=4.1,<8.0",
]

[project.urls]
Homepage = "https://github.com/modulith/modulith"
Documentation = "https://modulith.readthedocs.io"
Repository = "https://github.com/modulith/modulith"
Issues = "https://github.com/modulith/modulith/issues"

# The `modulith` console script. Available on PATH after `pip install`.
# Implementation lives in modulith/cli.py.
[project.scripts]
modulith = "modulith.cli:main"

# Plugin discovery entry-point group. Third-party plugins register here.
# Example for a plugin package's own pyproject.toml:
#
#   [project.entry-points."modulith"]
#   my_verifier = "my_package.plugins:MyVerifier"
#
# pluggy's plugin manager iterates this group at startup.
[project.entry-points."modulith"]
# (Built-in plugins are loaded directly by manager.BUILTIN_PLUGINS,
# not via entry points. This section is intentionally empty for the
# modulith package itself — third parties populate it in their own
# pyproject.toml files.)

# Pytest plugin entry point. Installs `modulith.testing` as a pytest
# plugin so fixtures (modulith_app, modulith_module, scenario) become
# available automatically on `pip install modulith[test]`.
[project.entry-points."pytest11"]
modulith = "modulith.testing"

# ---------------------------------------------------------------------------
# Tool configurations
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["modulith"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# examples/demo_app/tests exercises the modulith.testing scenario/modulith_app
# fixtures against a real (non-synthetic) app; without it here, CI's default
# `pytest` (no path argument) never collects it — testpaths is the only path
# pytest scans absent an explicit CLI path.
testpaths = ["tests", "examples/demo_app/tests"]
python_files = "test_*.py"
markers = [
    "integration: requires an external service (Redis, Postgres); skipped unless reachable",
    "modulith_isolated: run this test in a subprocess for full module isolation",
]
filterwarnings = [
    # aiosqlite runs one daemon worker thread per connection. Under
    # pytest-asyncio's per-test event loop, an operation cancelled in flight
    # (e.g. a DatabaseConsumer poll loop stopped mid-claim) can post its result
    # back AFTER that loop has already closed, so the worker thread raises
    # "Event loop is closed". It is a benign teardown race — every assertion has
    # already passed — that lives upstream in aiosqlite, not in modulith. Ignore
    # ONLY this exact artifact (scoped to _connection_worker_thread) so the
    # default suite stays deterministic under `-W error` without masking other
    # thread exceptions or warnings.
    "ignore:Exception in thread .*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles it
]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API uses Argument(...) and Option(...) as defaults;
# B008 ("function call in default") is a false positive for click/typer apps.
"modulith/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false  # decorators with TypeVar are awkward
# No exclusions: every module is implemented and type-checks under --strict.
# tests/ is type-checked in CI too (mypy --strict modulith/ tests/).
# tests/ has no __init__.py, so explicit package bases are needed for the
# files to map to `tests.*` module names (which the per-module strictness
# relaxations below key on) instead of colliding top-level names.
explicit_package_bases = true

[[tool.mypy.overrides]]
# pluggy's hookspec module-level decorator usage produces empty-body
# warnings under --strict because hookspecs are signature-only contracts.
module = "modulith.hooks"
disable_error_code = ["empty-body"]

[[tool.mypy.overrides]]
# Tests are type-checked, but not under full --strict: test functions are
# conventionally unannotated (pytest discovers them by name, not signature),
# and forcing `-> None` + fixture annotations on hundreds of tests adds
# noise without catching real bugs. Everything mypy can infer inside
# annotated code is still checked; only the strictness ratchets below are
# relaxed for the tests.* modules.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false
warn_unreachable = false

[[tool.mypy.overrides]]
# RATCHET — legacy tests written before tests/ came under mypy. They lean
# on runtime duck typing (stub engines/supervisors passed where the real
# type is annotated, tomllib `object` returns, dynamic attributes), which
# trips these codes inside otherwise-annotated functions. Do NOT add new
# modules here; new test files must type-check without entries in this
# list. Shrink it by annotating/narrowing the legacy files over time.
module = [
    "tests.conftest",
    "tests.test_cli",
    "tests.test_decorators",
    "tests.test_observability",
    "tests.test_outbox",
    "tests.test_postgres_adapter",
    "tests.test_postgres_integration",
    "tests.test_postgres_outbox_e2e",
    "tests.test_proxy",
    "tests.test_redis_broker",
    "tests.test_runtime_hooks",
    "tests.test_supervisor",
    "tests.test_sync",
    "tests.test_testing_plugin",
]
disable_error_code = [
    "arg-type",
    "attr-defined",
    "has-type",
    "misc",
    "operator",
    "union-attr",
]

[[tool.mypy.overrides]]
# Synthetic app packages that tests generate on disk at runtime (fixture
# factories write `fakeapp/`, the demo app installs as `shop`); they don't
# exist at type-check time. testcontainers, docker, and pyyaml ship no
# py.typed (pyyaml's stubs live in the separate types-PyYAML package, which
# the suite doesn't need — test code consumes safe_load output behind
# isinstance narrowing).
module = ["fakeapp", "fakeapp.*", "shop", "shop.*", "testcontainers.*", "docker", "docker.*", "yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Deliberately unimportable TYPE_CHECKING-only scaffold module: the G03
# regression test (tests/test_serializers.py, audit A6-r5-210) mirrors an
# event module whose annotation-only dependency isn't installed in the
# worker process. It must never resolve — silence import-not-found so the
# CI tests-lane `mypy --strict modulith/ tests/` stays green (DX, W2
# RESIDUALS item 12b).
module = ["nonexistent_debug_module"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Self-application of modulith (the framework using itself)
# ---------------------------------------------------------------------------
# When modulith eventually self-hosts (uses its own plugin manager to
# load its own built-ins), this section configures it. For v1 it's a
# placeholder showing the structure for downstream users to copy.

[tool.modulith]
# package = "myapp"          # auto-detected if not set
# outbox = "memory"          # default — switch to "postgres" for production
# broker = "memory"          # default — switch to "redis-streams" for IPC
# topology = "single"        # "single" | "processes" ("subinterpreters" reserved, not yet implemented)
# contracts_module = "contracts"  # name of the shared-events subpackage (default: "contracts")

[tool.modulith.verify]
# mode = "strict"            # "strict" for new projects, "ratchet" for migration
# baseline = ".modulith-baseline.json"
# disabled_rules = []        # rule names to skip, e.g. ["uses-contracts-module"]

# NOTE: the options subtable is `outbox_options` (NOT `outbox` — that
# spelling is the top-level string key selecting the adapter, and a legacy
# `[tool.modulith.outbox]` subtable is rejected with a ConfigurationError).
[tool.modulith.outbox_options]
# completion_mode = "update" # "update" | "delete" | "archive"
# retry_interval_seconds = 30
# max_attempts = 10
# max_retry_backoff_seconds = 300

[tool.modulith.workers]
# default = 1                # workers per module
# reports = 4                # override for high-traffic modules
