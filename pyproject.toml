# modulith — pyproject.toml
#
# This is the project metadata and build configuration. It defines:
#   - Package metadata (name, version, description, license, authors)
#   - Runtime dependencies (just pluggy, intentionally minimal)
#   - Optional extras (postgres, redis, database, otel, fastapi, cli, test,
#     test-suite, integration, all, dev — no kafka extra: the adapter is
#     unshipped, see the NOTE below)
#   - The `modulith` console script entry point
#   - The `modulith` plugin entry point group for third-party plugins
#   - Tool configurations (pytest, ruff, mypy)
#
# Design notes:
# - Core dependencies are intentionally minimal. We don't pull in SQLAlchemy
#   for users who don't use the outbox; we don't pull in FastAPI for users
#   who use Starlette directly. Each adapter goes behind an extra.
# - `pip install modupy` gives you the framework. `pip install modupy[all]`
#   gives you everything. Most users will pick 2-3 extras.

[build-system]
# Floor is 1.27, the first hatchling that understands the PEP 639 SPDX
# `license = "Apache-2.0"` expression used below. Older backends still build,
# but emit Metadata-Version 2.1 with a free-text `License:` field (plus an
# out-of-spec `License-File:`) instead of `License-Expression:`, so a build
# under a constraints file capping hatchling would ship different license
# provenance from the PyPI artifact.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Distribution name only. The import name, the console script, the config
# table and the environment-variable prefix are all `modulith`; the PyPI name
# `modulith` belongs to an unrelated project, so the distribution ships as
# `modupy` (`pip install modupy` then `import modulith`).
name = "modupy"
version = "0.11.0"
description = "Modular monolith pattern for Python — module structure, event-driven boundaries, transactional outbox, optional process-per-module runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jean Sossmeier", email = "jeansossmeier@gmail.com" }]
keywords = [
    "modular-monolith",
    "ddd",
    "event-driven",
    "transactional-outbox",
    "fastapi",
    "spring-modulith",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: FastAPI",
]

# Core runtime dependencies. Kept minimal on purpose — every dep is an
# adoption tax. pluggy is the only non-stdlib must-have.
dependencies = [
    "pluggy>=1.3,<2.0",
]

# Upper bounds on every optional dep: a future major-version bump in any
# of these libraries can break adapter contracts (SQLAlchemy 3.0, redis 7,
# OTel 2.0, etc.) without warning. Pinning the upper bound forces a
# conscious decision to test against the next major before letting users
# resolve to it. We loosen these per release as compatibility is verified.
[project.optional-dependencies]
# Postgres outbox adapter. Pulls in async SQLAlchemy + asyncpg, plus
# Alembic for the outbox schema migrations in adapters/migrations/. Alembic's
# command API is synchronous, so it can't drive asyncpg directly — psycopg is
# the sync driver Alembic actually connects with (postgresql+psycopg://) to
# run `alembic upgrade head` against a real Postgres.
# Every SQLAlchemy requirement here names the [asyncio] extra: SQLAlchemy 2.1
# installs greenlet only through it, and sqlalchemy.ext.asyncio refuses to
# import without greenlet.
postgres = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
]

# Redis Streams broker. An explicit networked alternative to the local SHM
# default used by process-per-module mode.
# redis-py 5.0.1/6/7 are API-compatible for the commands the adapter uses
# (XADD/XREADGROUP/XAUTOCLAIM/XACK and aclose()); floor excludes 5.0.0, which
# has close() but not aclose() (added in 5.0.1); upper bound tracks the next
# unverified major.
redis = [
    "redis>=5.0.1,<9.0",
]

# Database broker (relational DB as cross-module transport — Redis-free
# process-per-module). One adapter, three dialects inferred from the URL:
# Postgres/MySQL for a real server broker, SQLite for zero-dependency
# bootstrap. Pulls in async SQLAlchemy plus a driver per dialect the app uses
# (asyncpg / aiomysql / aiosqlite), plus Alembic (+ its sync MySQL driver,
# PyMySQL — Alembic's command API is synchronous, so it can't drive aiomysql
# directly) to run the broker schema migrations in adapters/migrations/.
database = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "aiomysql>=0.2,<1.0",
    # MySQL 8 defaults to caching_sha2_password auth, which aiomysql can only
    # perform when `cryptography` is present — required in practice for MySQL 8.
    # cryptography verified through 49.x (its installed test version); bound
    # tracks the next unverified release like every other extra here.
    "cryptography>=41.0,<50.0",
    "aiosqlite>=0.19,<1.0",
    "alembic>=1.13,<2.0",
    # PyMySQL 1.2.1 removed converters.escape_bytes_prefixed, which aiomysql
    # 0.3.2 (the latest release) imports and calls for every bytes parameter;
    # 1.2.3 restores the name as a string, so every MySQL write raises
    # TypeError. Lift the cap once aiomysql ships a compatible release.
    "pymysql>=1.1,<1.2.1",
]

# NOTE: a Kafka broker is on the roadmap (SPEC §10.3) but no adapter ships yet,
# so there is intentionally no `kafka` extra — we don't advertise a dependency
# for a feature that does not exist. It will return when the adapter lands.

# OpenTelemetry auto-instrumentation. Silent no-op if user hasn't
# configured a provider; just spans across module boundaries.
otel = [
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
]

# FastAPI integration helpers. Most users have FastAPI installed already;
# this extra is just for the worker module's create_app() factory.
fastapi = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "httpx>=0.26,<1.0",
]

# The CLI requires typer. Pulled out so users who run modulith without
# the CLI (just `import modulith`) don't pay typer's startup cost.
cli = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
]

# Test plugin (separate package conceptually, but shipped inside modupy as
# this extra; a standalone pytest-modupy remains a possible future split).
#
# This is what users install for the plugin: modulith/testing.py imports only
# pytest and the standard library, so the extra holds just pytest and
# pytest-asyncio. Everything modupy's own suite needs lives in `test-suite`.
test = [
    "pytest>=7.4,<10.0",
    "pytest-asyncio>=0.23,<2.0",
]

# Everything modupy's default (non-integration) test suite imports at
# collection time, so `pip install modupy[test-suite] && pytest` is
# reproducible. The suite runs the Postgres adapter against aiosqlite, so we
# pull SQLAlchemy + alembic + aiosqlite directly (NOT asyncpg — the sqlite path
# doesn't need it), plus the feature extras whose libraries the tests import
# (fastapi/httpx for proxy+worker, typer for CLI, otel for observability, redis
# for the broker unit tests, and build for isolated extraction-wheel checks).
test-suite = [
    "modupy[test]",
    "pytest-timeout>=2.1,<3.0",
    "build>=1.2,<2.0",
    "hatchling>=1.27",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.19,<1.0",
    # tests/test_ci_config.py parses .github/workflows/ci.yml structurally
    # (yaml.safe_load) to execute the integration lane's guard logic against
    # synthetic pytest summaries — the CI-drift guards run in the default lane.
    "pyyaml>=6.0,<7.0",
    # fastapi.testclient (Starlette's TestClient) imports httpx2 first and falls back
    # to httpx with a StarletteDeprecationWarning. 2.0 is the floor Starlette's own
    # `full` extra declares; the `fastapi` extra keeps httpx for modulith/proxy.py.
    "httpx2>=2.0,<3.0",
    "modupy[redis,otel,fastapi,cli]",
]

# Integration test suite — the testcontainers-backed end-to-end tests
# (tests/test_*_e2e.py, test_*_integration.py, test_migration_postgres.py,
# test_migration_mysql.py, test_process_topology_e2e.py). These spin up real
# Postgres + MySQL + Redis via Docker, so they need the REAL drivers, not the
# sqlite stand-in:
#   - testcontainers: starts disposable postgres:16 / mysql:8 / redis:7 containers
#   - asyncpg: the async Postgres driver the outbox + DB broker run on in prod
#   - aiomysql: the async MySQL driver the DB broker runs on against MySQL 8
#   - psycopg[binary]: the SYNC driver Alembic uses for the Postgres migration
#     test (postgresql+psycopg://) — asyncpg can't drive Alembic's sync engine
#   - pymysql: the SYNC driver Alembic uses for the MySQL migration test
#     (mysql+pymysql://), same reason — aiomysql can't drive it either
# Layered on `test-suite` so it also gets pytest, redis, fastapi, etc. Run with
# `pip install modupy[integration] && pytest -m integration`; the suite
# auto-skips these when Docker is unreachable (see tests/conftest.py).
integration = [
    "modupy[test-suite]",
    "testcontainers>=4.0,<5.0",
    "asyncpg>=0.29,<1.0",
    "aiomysql>=0.2,<1.0",
    # aiomysql needs cryptography to auth against MySQL 8 (caching_sha2_password).
    "cryptography>=41.0,<50.0",
    "psycopg[binary]>=3.1,<4.0",
    # Capped like the `database` extra: aiomysql breaks on PyMySQL >= 1.2.1.
    "pymysql>=1.1,<1.2.1",
]

# Everything. For "I want all the features" users.
all = [
    "modupy[postgres,redis,database,otel,fastapi,cli,test]",
]

# Development dependencies — for working ON modulith, not WITH it.
# Includes `integration`, which layers on `test-suite`, so contributors can
# run both the default suite and the testcontainers suite locally.
dev = [
    "modupy[all,integration]",
    "ruff>=0.4,<1.0",
    # mypy 2.0 verified: modulith/ + tests/ type-check clean under --strict
    # with mypy 2.0.0, so the bound is <3.0 (next unverified major). CI's
    # typecheck job installs this extra rather than an ad-hoc pin, so this
    # line is the ONLY place the constraint lives.
    "mypy>=1.10,<3.0",
    "pytest-cov>=4.1,<8.0",
    "pytest-timeout>=2.1,<3.0",
]

[project.urls]
Homepage = "https://github.com/jeansossmeier/modupy"
Documentation = "https://github.com/jeansossmeier/modupy/tree/main/docs"
Repository = "https://github.com/jeansossmeier/modupy"
Issues = "https://github.com/jeansossmeier/modupy/issues"
Changelog = "https://github.com/jeansossmeier/modupy/blob/main/CHANGELOG.md"

# The `modulith` console script. Available on PATH after `pip install`.
# Implementation lives in modulith/cli.py.
[project.scripts]
modulith = "modulith.cli:main"

# Plugin discovery entry-point group. Third-party plugins register here.
# Example for a plugin package's own pyproject.toml:
#
#   [project.entry-points."modulith"]
#   my_verifier = "my_package.plugins:MyVerifier"
#
# pluggy's plugin manager iterates this group at startup.
[project.entry-points."modulith"]
# (Built-in plugins are loaded directly by manager.BUILTIN_PLUGINS,
# not via entry points. This section is intentionally empty for the
# modulith package itself — third parties populate it in their own
# pyproject.toml files.)

# Pytest plugin entry point. Installs `modulith.testing` as a pytest
# plugin so fixtures (modulith_app, modulith_module, scenario) become
# available automatically on `pip install modupy[test]`.
[project.entry-points."pytest11"]
modulith = "modulith.testing"

# ---------------------------------------------------------------------------
# Tool configurations
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["modulith"]

[tool.hatch.build.targets.sdist]
# Keep reproducible analysis output and private broker state out even when a
# local build runs from a dirty tree. Package sources are listed as artifacts so
# newly-added runtime modules are not dropped merely because Git has not staged
# them yet.
artifacts = [
    "/modulith/**/*.py",
    "/modulith/**/*.ini",
    "/modulith/**/*.mako",
]
exclude = [
    "/.code_analyzer/**",
    "/.claude/**",
    "/.opencode/**",
    "/graphify-out/**",
    "**/.modulith-*.db*",
    "**/.modulith-*.hints",
    "**/*.db-wal",
    "**/*.db-shm",
    "**/*.db-journal",
    "**/*.hints",
    "**/*.mmap",
    "**/.*.hints.*.tmp",
    "**/.*.mmap.*.tmp",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pinned explicitly because pytest-asyncio warns when it is unset and will
# change the default in a future release. "function" matches what the suite
# already gets: every async fixture here is function-scoped (the only
# session-scoped fixtures in tests/conftest.py — the testcontainers URLs — are
# plain sync generators).
asyncio_default_fixture_loop_scope = "function"
# The suite makes real TCP binds, spawns child processes, and waits on queues
# and asyncio Events; without a bound a regression that never signals hangs the
# job until the CI hard limit with no traceback. 600s is generous enough to
# absorb a cold testcontainers image pull inside a session-scoped fixture,
# while still turning a hang into a pointed failure. timeout_method is left at
# its default deliberately: pytest-timeout uses SIGALRM where available, which
# dumps a traceback at the hung test and lets the rest of the run finish, and
# falls back to the thread method on Windows on its own.
timeout = 600
# pytest-timeout's SIGALRM dump shows only the main thread, which for an asyncio
# test is always the idle selector, so a hung await leaves no frame behind.
# faulthandler dumps EVERY thread (aiosqlite workers included) at 300s and lets
# the test run on to pytest-timeout's kill, so a hang records where it sat.
faulthandler_timeout = 300
# Each example under examples/ is a standalone project with its own pytest
# configuration and is tested from its own directory, so the repo root
# collects only tests/ — testpaths is the only path pytest scans absent an
# explicit CLI path.
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "integration: needs Docker or the network (testcontainers, docker compose, installs into fresh venvs)",
    "modulith_isolated: run this test in a subprocess for full module isolation",
    "real_process: real subprocess/signal tests that need no Docker",
]
filterwarnings = [
    # aiosqlite runs one daemon worker thread per connection. Under
    # pytest-asyncio's per-test event loop, an operation cancelled in flight
    # (e.g. a DatabaseConsumer poll loop stopped mid-claim) can post its result
    # back AFTER that loop has already closed, so the worker thread raises
    # "Event loop is closed". It is a benign teardown race — every assertion has
    # already passed — that lives upstream in aiosqlite, not in modulith. Ignore
    # ONLY this exact artifact (scoped to _connection_worker_thread) so the
    # default suite stays deterministic under `-W error` without masking other
    # thread exceptions or warnings.
    "ignore:Exception in thread .*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/*/build"]

[tool.coverage.run]
source = ["modulith"]
branch = true

[tool.coverage.report]
# Package-wide floor. Outbox is gated separately at 100% in CI
# (`coverage report --include='modulith/builtin/outbox.py' --fail-under=100`).
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles it
]

[tool.ruff.lint.isort]
# `from conftest import ...` is a sibling-module import: pytest's prepend import
# mode puts tests/ on sys.path, so test modules can import the shared helpers
# that live in tests/conftest.py. Without this, ruff classifies `conftest` as a
# third-party distribution and demands it be sorted in among httpx/pytest.
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API uses Argument(...) and Option(...) as defaults;
# B008 ("function call in default") is a false positive for click/typer apps.
"modulith/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# No exclusions: every module is implemented and type-checks under --strict.
# tests/ is type-checked in CI too (mypy --strict modulith/ tests/).
# tests/ has no __init__.py, so explicit package bases are needed for the
# files to map to `tests.*` module names (which the per-module strictness
# relaxations below key on) instead of colliding top-level names.
explicit_package_bases = true
exclude = ["^examples/[^/]+/build/"]

[[tool.mypy.overrides]]
# pluggy's hookspec module-level decorator usage produces empty-body
# warnings under --strict because hookspecs are signature-only contracts.
module = "modulith.hooks"
disable_error_code = ["empty-body"]

[[tool.mypy.overrides]]
# Tests are type-checked, but not under full --strict: test functions are
# conventionally unannotated (pytest discovers them by name, not signature),
# and forcing `-> None` + fixture annotations on hundreds of tests adds
# noise without catching real bugs. Everything mypy can infer inside
# annotated code is still checked; only the strictness ratchets below are
# relaxed for the tests.* modules.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false
warn_unreachable = false

[[tool.mypy.overrides]]
# RATCHET — legacy tests written before tests/ came under mypy. They lean
# on runtime duck typing (stub engines/supervisors passed where the real
# type is annotated, tomllib `object` returns, dynamic attributes), which
# trips these codes inside otherwise-annotated functions. Do NOT add new
# modules here; new test files must type-check without entries in this
# list. Shrink it by annotating/narrowing the legacy files over time.
module = [
    "tests.conftest",
    "tests.test_cli",
    "tests.test_decorators",
    "tests.test_observability",
    "tests.test_outbox",
    "tests.test_postgres_adapter",
    "tests.test_postgres_integration",
    "tests.test_postgres_outbox_e2e",
    "tests.test_proxy",
    "tests.test_redis_broker",
    "tests.test_runtime_hooks",
    "tests.test_supervisor",
    "tests.test_sync",
    "tests.test_testing_plugin",
]
disable_error_code = [
    "arg-type",
    "attr-defined",
    "has-type",
    "misc",
    "operator",
    "union-attr",
]

[[tool.mypy.overrides]]
# tests/ has no __init__.py, so mypy maps tests/conftest.py to `tests.conftest`
# and cannot resolve the bare name `conftest`. At runtime the bare name is the
# correct one: pytest's prepend import mode puts tests/ on sys.path, which is
# how the shared `_free_port` helper is shared across the topology/supervisor
# suites. Silence only the unresolvable import; the modules doing the importing
# stay fully type-checked.
module = ["conftest"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Synthetic app packages that tests generate on disk at runtime (fixture
# factories write `fakeapp/`, the demo app installs as `shop`); they don't
# exist at type-check time. testcontainers, docker, and pyyaml ship no
# py.typed (pyyaml's stubs live in the separate types-PyYAML package, which
# the suite doesn't need — test code consumes safe_load output behind
# isinstance narrowing).
module = ["fakeapp", "fakeapp.*", "myapp", "myapp.*", "shop", "shop.*", "marketplace", "marketplace.*", "marketplace_platform", "marketplace_platform.*", "testcontainers.*", "docker", "docker.*", "yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Deliberately unimportable TYPE_CHECKING-only scaffold module: a regression
# test in tests/test_serializers.py mirrors an event module whose
# annotation-only dependency isn't installed in the worker process. It must
# never resolve — silence import-not-found so the CI tests-lane
# `mypy --strict modulith/ tests/` stays green.
module = ["nonexistent_debug_module"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Self-application of modulith (the framework using itself)
# ---------------------------------------------------------------------------
# When modulith eventually self-hosts (uses its own plugin manager to
# load its own built-ins), this section configures it. For v1 it's a
# placeholder showing the structure for downstream users to copy.

[tool.modulith]
# package = "myapp"          # auto-detected if not set
# outbox = "memory"          # default — switch to "postgres" for production
# broker = "memory"          # default for single; processes defaults to durable local "shm"
# topology = "single"        # "single" | "processes" ("subinterpreters" reserved, not yet implemented)
# contracts_module = "contracts"  # name of the shared-events subpackage (default: "contracts")
# subscription_source = "manifest"  # "manifest" | "config" | "listener"
# actuator_mode = "auto"     # "auto" | "token" | "open" | "disabled"

[tool.modulith.verify]
# disabled_rules = []        # rule names to skip, e.g. ["use-contracts"]

# NOTE: the options subtable is `outbox_options` (NOT `outbox` — that
# spelling is the top-level string key selecting the adapter, and a legacy
# `[tool.modulith.outbox]` subtable is rejected with a ConfigurationError).
# The runtime forwards these keys, validated, only when it binds the store
# from `outbox_url`: claim_strategy, claim_lease_seconds, claim_batch_size,
# dead_letter_after_attempts, retry_interval_seconds, retry_stale_seconds,
# max_retry_backoff_seconds and completion_mode. Any other key here is
# accepted and ignored; a store the application binds itself takes its
# settings as outbox.configure() keyword arguments instead.
[tool.modulith.outbox_options]
# completion_mode = "update" # "update" | "delete" | "archive"
# claim_strategy = "lease"   # "lease" | "advisory_lock" | "none"
# claim_lease_seconds = 60.0
# claim_batch_size = 100
# retry_interval_seconds = 30
# retry_stale_seconds = 30
# dead_letter_after_attempts = 10  # NOT `max_attempts` — that is the broker
#                                  # consumer's redelivery cap, a different knob
# max_retry_backoff_seconds = 300

# Broker options. Local SHM uses canonical private paths; an omitted process
# broker becomes "database" instead when url/dsn is configured.
# [tool.modulith.broker_options]
# state_dir = "/private/app-state"       # package-namespaced default if omitted
# sqlite_path = "broker.db"              # relative to state_dir
# hint_path = "broker.hints"             # advisory sequence notifier only
# sqlite_synchronous = "NORMAL"          # use "FULL" for power-loss durability
# max_payload_bytes = 16777216            # default 16 MiB; maximum 1 GiB
# max_store_bytes = 1073741824            # default 1 GiB; maximum 1 TiB
# shm_slot_size is deprecated and ignored; hint slots are fixed-size sequences
# url = "postgresql+asyncpg://..."       # selects database when broker is omitted
# no_subscriber_policy = "error"   # "error" | "wait" | "store"
# orphan_replay_policy = "ttl_all_groups"  # "ttl_all_groups" | "first_groups" | "expected_groups"
# orphan_retention_seconds = 3600        # replay window: default 1 h on shm, 24 h on database;
#                                        # shm keeps even acked publications this long

[tool.modulith.workers]
# default = 1                # workers per module
# reports = 4                # override for high-traffic modules
