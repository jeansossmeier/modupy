[project]
name = "modulith-demo-shop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["modupy[fastapi,cli,postgres]", "aiosqlite"]

[project.optional-dependencies]
redis = ["modupy[redis]"]
test = ["pytest", "pytest-asyncio", "httpx2"]

[tool.modulith]
package = "shop"

[tool.modulith.workers]
inventory = 2

[tool.modulith.broker_options]
state_dir = ".modulith"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["shop"]
known-third-party = ["modulith"]
