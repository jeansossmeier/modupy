# Infrastructure for the shop's stage 4 (see README.md). Stages 1 to 3 need none.
#
#   postgres  stage 4a: the transactional outbox on Postgres
#   redis     stage 4b: the process-per-module topology over Redis Streams
#
# Both publish on non-default ports of the loopback interface, so a Postgres or
# Redis of your own on 5432 or 6379 never collides with them. The credentials
# are throwaway demo values committed to this repo, which is why the ports stay
# on 127.0.0.1: never widen them to 0.0.0.0 on a shared network.
#
#   docker compose up -d --wait postgres
#   docker compose up -d --wait redis
#   docker compose down -v

services:
  postgres:
    # Pinned 2026-07-14: re-pinning after testing is the deliberate update path.
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    environment:
      POSTGRES_USER: modulith
      POSTGRES_PASSWORD: modulith
      POSTGRES_DB: modulith
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - modulith-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulith"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    # Pinned 2026-07-14: re-pinning after testing is the deliberate update path.
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # The image's default config has no password and protected-mode is inert
    # once the port is published, so require one explicitly.
    command: ["redis-server", "--requirepass", "modulith"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a modulith ping"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  modulith-postgres-data:
